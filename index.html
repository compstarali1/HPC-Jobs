<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HPC — Smart Job Scanner</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        :root {
            --bg: #0b0f1a;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --card-bg: rgba(255, 255, 255, 0.04);
            --text: #f0f4ff;
            --muted: #718096;
            --cyan: #34e7e4;
            --amber: #ffb347;
            --green: #2dd4a7;
            --blue: #5b8cff;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            --radius: 24px;
            --card-radius: 16px;
        }
        [data-theme="light"] {
            --bg: #eef2f9;
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.9);
            --card-bg: rgba(0, 0, 0, 0.03);
            --text: #1a202c;
            --muted: #718096;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
            position: relative;
        }
        .orb {
            position: fixed;
            width: 300px; height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.2;
            z-index: 0;
            pointer-events: none;
            animation: floatOrb 20s infinite alternate ease-in-out;
        }
        .orb1 { background: #34e7e4; top: -50px; left: -80px; }
        .orb2 { background: #b983ff; bottom: -30px; right: -20px; animation-delay: 4s; }
        .orb3 { background: #ffb347; top: 40%; left: 70%; animation-delay: 8s; }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, -40px) scale(1.1); }
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo i { font-size: 32px; color: var(--cyan); text-shadow: 0 0 15px var(--cyan); }
        h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.5px; }
        .theme-toggle {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover { transform: scale(1.05); }
        .input-area {
            width: 100%;
            padding: 16px 20px;
            border-radius: var(--radius);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            font-size: 0.95rem;
            resize: vertical;
            min-height: 100px;
            transition: 0.2s;
        }
        .input-area:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(52,231,228,0.15); }
        
        .btn-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 16px 0;
        }
        .btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 12px 14px;
            border-radius: 12px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-1px);
        }
        .btn-danger { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.25); color: #fca5a5; }
        .btn-scan { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.25); color: #6ee7b7; }
        .btn-floating-scan {
            position: fixed;
            bottom: 24px; right: 24px;
            width: 64px; height: 64px;
            border-radius: 50%;
            font-size: 28px;
            background: linear-gradient(145deg, #ef4444, #dc2626);
            border: none;
            box-shadow: 0 8px 24px rgba(239,68,68,0.35);
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
            cursor: pointer;
            animation: breathe 3s infinite;
        }
        @keyframes breathe { 0%{box-shadow:0 0 0 0 rgba(239,68,68,0.4);} 70%{box-shadow:0 0 0 16px rgba(239,68,68,0);} 100%{box-shadow:0 0 0 0 rgba(239,68,68,0);} }
        .btn-floating-scan:active { transform: scale(0.92); }
        
        /* STATS — one row */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .stat-card {
            padding: 14px 12px;
            border-radius: 14px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            text-align: center;
        }
        .stat-num { font-size: 1.4rem; font-weight: 700; line-height: 1.2; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
        .cyan { color: var(--cyan); } .amber { color: var(--amber); } .green { color: var(--green); } .blue { color: var(--blue); }
        
        .section {
            margin: 24px 0;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 16px;
            padding-left: 4px;
        }
        .section-header span { font-size: 1rem; opacity: 0.6; font-weight: 400; }
        
        /* ✅ 2-COLUMN GRID — split registrations evenly across 2 columns */
        .two-column-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 24px;
        }
        .column-title {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .reg-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        /* ✅ Registration Item Style */
        .reg-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            transition: all 0.2s ease;
        }
        .reg-item:hover {
            background: rgba(255,255,255,0.06);
        }
        .reg-item.found {
            background: rgba(52,231,228,0.05);
            border-color: rgba(52,231,228,0.15);
        }
        .reg-item.completed {
            background: rgba(45,212,167,0.05);
            border-color: rgba(45,212,167,0.15);
        }
        
        .reg-checkbox {
            width: 18px; height: 18px;
            margin-top: 1px;
            accent-color: var(--green);
            cursor: pointer;
            flex-shrink: 0;
        }
        .reg-text {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .reg-note {
            font-size: 0.75rem;
            color: var(--muted);
            margin-left: 8px;
            font-style: italic;
        }
        .reg-hint {
            font-size: 0.75rem;
            color: var(--muted);
            margin-left: auto;
        }
        .reg-actions {
            margin-left: auto;
        }
        .reg-btn {
            background: transparent;
            border: none;
            color: var(--green);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            padding: 3px 8px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .reg-btn:hover { background: rgba(45,212,167,0.1); }
        .reg-btn.restore { color: var(--cyan); }
        .reg-btn.restore:hover { background: rgba(52,231,228,0.1); }
        
        /* Close button */
        .reg-close {
            position: absolute;
            top: 6px; right: 8px;
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 14px;
            cursor: pointer;
            line-height: 1;
            width: 18px; height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .reg-close:hover {
            background: rgba(239,68,68,0.15);
            color: #f87171;
        }
        
        /* Single column for Found & Completed */
        .single-column {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            width: 90%; max-width: 480px;
            padding: 24px;
            border-radius: 20px;
            background: var(--bg);
            border: 1px solid var(--glass-border);
        }
        .hidden { display: none; }
        .toast-container {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 2000;
            display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 10px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            animation: slideDown 0.3s ease;
            font-weight: 500;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-16px);} to { opacity: 1; transform: translateY(0);} }
        .scanner-frame {
            width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 16px; position: relative; overflow: hidden; margin: 16px 0;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-beam { position: absolute; height: 3px; width: 100%; background: linear-gradient(90deg, transparent, #ef4444, transparent); animation: beam 2s infinite; }
        @keyframes beam { 0%{top: 0;} 50%{top: calc(100% - 3px);} 100%{top: 0;} }
        .flex { display: flex; gap: 10px; align-items: center; }
        .mt-2 { margin-top: 16px; }
        .btn-small { padding: 8px 14px; font-size: 0.85rem; border-radius: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .two-column-grid { grid-template-columns: 1fr; gap: 16px; }
            .btn-group { grid-template-columns: repeat(2, 1fr); }
            .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }
    </style>
</head>
<body data-theme="dark">
    <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
    <div class="toast-container" id="toastContainer"></div>
    <div class="container">
        <header>
            <div class="logo"><i>⌁</i><h1>HPC — Smart Job Scanner</h1></div>
            <div class="theme-toggle" id="themeToggle">🌙</div>
        </header>

        <textarea id="inputArea" class="input-area" placeholder="Paste registrations here — one per line&#10;Add ' - DONE' at end to auto-move to Completed&#10;Example: NX22ULU  or  NX22ULU - DONE"></textarea>
        
        <div class="btn-group">
            <button class="btn" id="rebuildBtn">⟳ REBUILD</button>
            <button class="btn btn-danger" id="removeBtn">✕ REMOVE</button>
            <button class="btn btn-scan" id="scanBtn">📷 SCAN</button>
            <button class="btn btn-danger" id="resetBtn">⌫ RESET</button>
            <button class="btn" id="completedBtn">✓ COMPLETED</button>
            <button class="btn" id="exportBtn">⬇ EXPORT</button>
            <button class="btn" id="saveBtn">💾 SAVE</button>
            <button class="btn" id="restoreBtn">⬆ RESTORE</button>
        </div>
        
        <div class="stats">
            <div class="stat-card"><div class="stat-num cyan" id="foundCount">0</div><div class="stat-label">FOUND</div></div>
            <div class="stat-card"><div class="stat-num amber" id="pendingCount">0</div><div class="stat-label">PENDING</div></div>
            <div class="stat-card"><div class="stat-num green" id="doneCount">0</div><div class="stat-label">DONE</div></div>
            <div class="stat-card"><div class="stat-num blue" id="totalCount">0</div><div class="stat-label">TOTAL</div></div>
        </div>

        <div class="section" id="foundSection">
            <div class="section-header">💠 FOUND <span>(scanned)</span></div>
            <div id="foundList" class="single-column"></div>
        </div>
        
        <div class="section" id="pendingSection">
            <div class="section-header">⏳ PENDING</div>
            <!-- ✅ 2 COLUMN LAYOUT -->
            <div id="pendingContainer" class="two-column-grid">
                <div id="pendingCol1" class="reg-list"></div>
                <div id="pendingCol2" class="reg-list"></div>
            </div>
        </div>
        
        <div class="section" id="completedSection">
            <div class="section-header">✅ COMPLETED</div>
            <div id="completedList" class="single-column"></div>
        </div>
    </div>

    <button class="btn-floating-scan" id="floatingScan">📷</button>

    <div class="modal hidden" id="scannerModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 12px;">📷 Scan Registration</h3>
            <div class="scanner-frame">
                <video id="video" autoplay muted></video>
                <div class="scan-beam"></div>
            </div>
            <div class="flex mt-2">
                <button class="btn btn-small" id="torchBtn">🔦 Torch</button>
                <button class="btn btn-small btn-danger" id="closeScanner">✕ Close</button>
            </div>
        </div>
    </div>

    <div class="modal hidden" id="exportModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 16px;">⬇ Export Jobs</h3>
            <div class="grid-2">
                <button class="btn" id="exportAll">All Registrations</button>
                <button class="btn" id="exportCompleted">Completed Only</button>
                <button class="btn" id="exportRemaining">Remaining Only</button>
            </div>
            <button class="btn mt-2" id="closeExport">Cancel</button>
        </div>
    </div>

    <script>
        let found = [];
        let pending = [];
        let completed = [];
        let notes = {};
        let checkedItems = {};

        const $ = id => document.getElementById(id);
        const inputArea = $('inputArea');
        const foundList = $('foundList');
        const pendingCol1 = $('pendingCol1');
        const pendingCol2 = $('pendingCol2');
        const completedList = $('completedList');
        const toastContainer = $('toastContainer');

        function toast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            toastContainer.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function updateStats() {
            $('foundCount').textContent = found.length;
            $('pendingCount').textContent = pending.length;
            $('doneCount').textContent = completed.length;
            $('totalCount').textContent = found.length + pending.length + completed.length;
        }

        // Create registration item HTML
        function createRegItem(reg, listType) {
            const isChecked = checkedItems[reg] || false;
            const div = document.createElement('div');
            div.className = `reg-item ${listType === 'found' ? 'found' : ''} ${listType === 'completed' ? 'completed' : ''}`;
            
            let content = '';
            if (listType === 'pending') {
                content = `
                    <input type="checkbox" class="reg-checkbox" ${isChecked ? 'checked' : ''} 
                        onchange="toggleCheck('${reg}', this.checked)">
                    <span class="reg-text">${reg}</span>
                    ${notes[reg] ? `<span class="reg-note">${notes[reg]}</span>` : ''}
                    ${isChecked 
                        ? `<span class="reg-actions"><button class="reg-btn" onclick="markComplete('${reg}')">✓ COMPLETE</button></span>`
                        : `<span class="reg-hint">Check to complete</span>`
                    }
                    <button class="reg-close" onclick="removeItem('${reg}', 'pending')">×</button>
                `;
            } else if (listType === 'found') {
                content = `
                    <input type="checkbox" class="reg-checkbox" checked disabled>
                    <span class="reg-text">${reg}</span>
                    ${notes[reg] ? `<span class="reg-note">${notes[reg]}</span>` : ''}
                    <button class="reg-close" onclick="removeItem('${reg}', 'found')">×</button>
                `;
            } else if (listType === 'completed') {
                content = `
                    <input type="checkbox" class="reg-checkbox" checked disabled>
                    <span class="reg-text">${reg}</span>
                    ${notes[reg] ? `<span class="reg-note">${notes[reg]}</span>` : ''}
                    <span class="reg-actions"><button class="reg-btn restore" onclick="restoreItem('${reg}')">↩️ RESTORE</button></span>
                    <button class="reg-close" onclick="removeItem('${reg}', 'completed')">×</button>
                `;
            }
            div.innerHTML = content;
            return div;
        }

        function render() {
            // Clear all
            foundList.innerHTML = '';
            pendingCol1.innerHTML = '';
            pendingCol2.innerHTML = '';
            completedList.innerHTML = '';
            
            // Found items
            found.forEach(reg => {
                foundList.appendChild(createRegItem(reg, 'found'));
            });
            
            // ✅ Split pending evenly into 2 columns
            const mid = Math.ceil(pending.length / 2);
            const leftCol = pending.slice(0, mid);
            const rightCol = pending.slice(mid);
            
            leftCol.forEach(reg => {
                pendingCol1.appendChild(createRegItem(reg, 'pending'));
            });
            rightCol.forEach(reg => {
                pendingCol2.appendChild(createRegItem(reg, 'pending'));
            });
            
            // Completed items
            completed.forEach(reg => {
                completedList.appendChild(createRegItem(reg, 'completed'));
            });
            
            updateStats();
            localStorage.setItem('hpcData', JSON.stringify({ found, pending, completed, notes, checkedItems }));
        }

        window.toggleCheck = (reg, checked) => {
            checkedItems[reg] = checked;
            render();
        };

        function parseInput() {
            const text = inputArea.value;
            if (!text.trim()) return toast('Nothing to parse');
            
            const lines = text.split(/\n/);
            let added = 0, done = 0;
            
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                
                // ✅ Check for " - DONE" suffix
                const isDone = /\s*-\s*DONE$/i.test(line);
                let cleanLine = line.replace(/\s*-\s*DONE$/i, '').trim();
                
                // Extract registration number — match standard UK format
                const words = cleanLine.split(/\s+/).filter(Boolean);
                let foundReg = null;
                let extraNote = '';
                
                words.forEach(word => {
                    const upp = word.toUpperCase().replace(/[^A-Z0-9]/g, '');
                    // UK reg pattern: 2-3 letters + 2 digits + 3 letters, or similar
                    if (/^[A-Z]{1,3}[0-9]{1,4}[A-Z]{0,3}$/.test(upp) || /^[0-9]{2,4}[A-Z]{2,3}$/.test(upp)) {
                        if (!foundReg) foundReg = upp;
                        else extraNote += (extraNote ? ' ' : '') + word;
                    } else if (word !== upp) {
                        // keep non-reg text as note
                        extraNote += (extraNote ? ' ' : '') + word;
                    }
                });
                
                if (foundReg) {
                    if (extraNote && !notes[foundReg]) notes[foundReg] = extraNote;
                    
                    if (isDone) {
                        // Auto move to Completed
                        if (!completed.includes(foundReg) && !found.includes(foundReg)) {
                            completed.push(foundReg);
                            done++;
                        }
                    } else {
                        if (!pending.includes(foundReg) && !found.includes(foundReg) && !completed.includes(foundReg)) {
                            pending.push(foundReg);
                            added++;
                        }
                    }
                }
            });
            
            let msg = '';
            if (added > 0) msg += `➕ Added ${added} to Pending`;
            if (done > 0) msg += `${msg ? ', ' : ''}✅ ${done} moved to Completed`;
            if (msg) toast(msg);
            else toast('No new registrations found');
            
            render();
        }

        window.removeItem = (reg, list) => {
            if (!confirm(`Remove ${reg}?`)) return;
            if (list === 'found') found = found.filter(r => r !== reg);
            if (list === 'pending') {
                pending = pending.filter(r => r !== reg);
                delete checkedItems[reg];
            }
            if (list === 'completed') completed = completed.filter(r => r !== reg);
            delete notes[reg];
            toast(`🗑️ Removed ${reg}`);
            render();
        };

        window.markComplete = (reg) => {
            pending = pending.filter(r => r !== reg);
            delete checkedItems[reg];
            if (!completed.includes(reg)) completed.push(reg);
            toast(`✅ ${reg} completed`);
            render();
        };

        window.restoreItem = (reg) => {
            completed = completed.filter(r => r !== reg);
            if (!pending.includes(reg)) pending.unshift(reg);
            toast(`↩️ ${reg} restored to Pending`);
            render();
        };

        $('rebuildBtn').onclick = parseInput;

        $('removeBtn').onclick = () => {
            const selected = pending.filter(r => checkedItems[r]);
            if (!selected.length) return toast('No items selected');
            if (confirm(`Remove ${selected.length} selected item(s)?`)) {
                selected.forEach(r => {
                    pending = pending.filter(p => p !== r);
                    delete checkedItems[r];
                });
                toast(`Removed ${selected.length} item(s)`);
                render();
            }
        };

        $('resetBtn').onclick = () => {
            if (confirm('⚠️ Reset ALL data? This cannot be undone!')) {
                found = []; pending = []; completed = []; notes = {}; checkedItems = {};
                inputArea.value = '';
                render();
                toast('♻️ All data reset');
            }
        };

        $('completedBtn').onclick = () => {
            const selected = pending.filter(r => checkedItems[r]);
            if (!selected.length) return toast('No items selected — check boxes first');
            if (confirm(`Move ${selected.length} item(s) to Completed?`)) {
                selected.forEach(r => {
                    pending = pending.filter(p => p !== r);
                    delete checkedItems[r];
                    if (!completed.includes(r)) completed.push(r);
                });
                toast(`✅ ${selected.length} item(s) moved to Completed`);
                render();
            }
        };

        $('scanBtn').onclick = openScanner;
        $('floatingScan').onclick = openScanner;

        $('exportBtn').onclick = () => $('exportModal').classList.remove('hidden');
        $('closeExport').onclick = () => $('exportModal').classList.add('hidden');
        
        $('exportAll').onclick = () => exportFile('ALL', [...found, ...pending, ...completed]);
        $('exportCompleted').onclick = () => exportFile('COMPLETED', completed);
        $('exportRemaining').onclick = () => exportFile('REMAINING', [...found, ...pending]);
        
        function exportFile(type, data) {
            const d = new Date();
            const date = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
            const content = data.map(r => `${r}${notes[r] ? ' — ' + notes[r] : ''}`).join('\n');
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `HPC-${type}-${date}.txt`;
            a.click();
            $('exportModal').classList.add('hidden');
            toast('⬇ Export downloaded');
        }

        $('saveBtn').onclick = () => {
            const d = new Date();
            const date = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
            const data = { found, pending, completed, notes, checkedItems };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `HPC-SAVED-${date}.json`;
            a.click();
            toast('💾 Saved to file');
        };

        $('restoreBtn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const obj = JSON.parse(ev.target.result);
                        found = obj.found || [];
                        pending = obj.pending || [];
                        completed = obj.completed || [];
                        notes = obj.notes || {};
                        checkedItems = obj.checkedItems || {};
                        render();
                        toast('⬆ Restored successfully');
                    } catch {
                        toast('⚠️ Invalid file format');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        };

        let stream = null;
        function openScanner() {
            $('scannerModal').classList.remove('hidden');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(s => {
                    stream = s;
                    $('video').srcObject = s;
                    startOCR();
                }).catch(() => toast('Camera unavailable — check permissions'));
        }

        function startOCR() {
            const video = $('video');
            const recognize = async () => {
                if (!video.srcObject) return;
                try {
                    const { data: { text } } = await Tesseract.recognize(video, 'eng');
                    const regs = text.match(/([A-Z]{1,3}[0-9]{1,4}[A-Z]{0,3})/g);
                    if (regs) {
                        const reg = regs[0].toUpperCase();
                        if (found.includes(reg) || completed.includes(reg)) {
                            toast(`⚠️ ${reg} — already exists`);
                            return;
                        }
                        if (pending.includes(reg)) {
                            pending = pending.filter(r => r !== reg);
                        }
                        found.push(reg);
                        toast(`✅ ${reg} FOUND!`);
                        render();
                        setTimeout(closeScanner, 600);
                        return;
                    }
                } catch(e) {}
                setTimeout(recognize, 2000);
            };
            recognize();
        }

        function closeScanner() {
            $('scannerModal').classList.add('hidden');
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        }

        $('closeScanner').onclick = closeScanner;
        $('torchBtn').onclick = () => {
            const track = stream?.getVideoTracks()[0];
            if (!track) return;
            const capabilities = track.getCapabilities();
            if (!capabilities.torch) return toast('🔦 Torch not supported');
            track.applyConstraints({ advanced: [{ torch: true }] })
                .catch(() => toast('🔦 Torch not supported'));
        };

        $('themeToggle').onclick = () => {
            const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            $('themeToggle').textContent = next === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('hpc_theme', next);
        };

        window.addEventListener('load', () => {
            const savedTheme = localStorage.getItem('hpc_theme') || 'dark';
            document.documentElement.dataset.theme = savedTheme;
            $('themeToggle').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
            
            const saved = localStorage.getItem('hpcData');
            if (saved) {
                try {
                    const obj = JSON.parse(saved);
                    found = obj.found || [];
                    pending = obj.pending || [];
                    completed = obj.completed || [];
                    notes = obj.notes || {};
                    checkedItems = obj.checkedItems || {};
                } catch(e) {}
            }
            render();
        });
    </script>
</body>
</html>
