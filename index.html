<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HPC — Smart Job Scanner</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        :root {
            --bg: #0b0f1a;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --card-bg: rgba(255, 255, 255, 0.04);
            --text: #f0f4ff;
            --muted: #718096;
            --cyan: #34e7e4;
            --amber: #ffb347;
            --green: #2dd4a7;
            --blue: #5b8cff;
            --red: #f87171;
            --danger-bg: rgba(239,68,68,0.12);
            --danger-border: rgba(239,68,68,0.25);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            --radius: 12px;
        }
        [data-theme="light"] {
            --bg: #eef2f9;
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.9);
            --card-bg: rgba(0, 0, 0, 0.03);
            --text: #1a202c;
            --muted: #718096;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
            position: relative;
        }
        .orb {
            position: fixed;
            width: 300px; height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        .orb1 { background: #34e7e4; top: -50px; left: -80px; }
        .orb2 { background: #b983ff; bottom: -30px; right: -20px; }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 20px;
        }
        h1 { font-size: 1.4rem; font-weight: 600; }
        .theme-toggle {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }
        
        /* Auto-expanding Paste Area */
        .paste-container {
            position: relative;
            margin-bottom: 24px;
        }
        .paste-label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 6px;
            display: block;
        }
        .input-wrapper { position: relative; }
        .input-area {
            width: 100%;
            padding: 14px 16px;
            padding-right: 40px;
            border-radius: var(--radius);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            font-size: 0.95rem;
            line-height: 1.5;
            min-height: 80px;
            height: auto;
            overflow: hidden;
            resize: none;
            transition: border-color 0.2s;
        }
        .input-area:focus { outline: none; border-color: var(--cyan); }
        .clear-paste {
            position: absolute;
            top: 12px; right: 12px;
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 18px;
            cursor: pointer;
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            z-index: 2;
        }
        .clear-paste:hover { background: rgba(239,68,68,0.15); color: var(--red); }
        
        /* BUTTONS — 2 rows, 4 per line, auto-resizing */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }
        .button-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
        }
        .btn {
            padding: 14px 10px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            min-height: 52px;
            white-space: nowrap;
        }
        .btn-default {
            background: var(--glass);
            border-color: var(--glass-border);
            color: var(--text);
        }
        .btn-default:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
        .btn-danger {
            background: var(--danger-bg);
            border-color: var(--danger-border);
            color: var(--red);
        }
        .btn-danger:hover { background: rgba(239,68,68,0.2); }
        .btn-scan {
            background: rgba(16,185,129,0.12);
            border-color: rgba(16,185,129,0.25);
            color: #6ee7b7;
        }
        .btn-scan:hover { background: rgba(16,185,129,0.18); }
        
        /* STATS — 4 in one horizontal line */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .stat-box {
            padding: 16px 12px;
            border-radius: var(--radius);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            text-align: center;
        }
        .stat-value { font-size: 1.8rem; font-weight: 700; line-height: 1.2; }
        .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 2px; text-transform: uppercase; }
        .cyan { color: var(--cyan); }
        .amber { color: var(--amber); }
        .green { color: var(--green); }
        .blue { color: var(--blue); }
        
        .section { margin: 32px 0; }
        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 2-Column Pending Layout */
        .two-column-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 20px;
        }
        .column { display: flex; flex-direction: column; gap: 8px; }
        
        /* Registration Cards */
        .reg-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: var(--radius);
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
            transition: all 0.15s ease;
        }
        .reg-card:hover { background: rgba(255,255,255,0.05); }
        .reg-card.completed {
            background: rgba(45,212,167,0.05);
            border-color: rgba(45,212,167,0.12);
        }
        .reg-card.found {
            background: rgba(52,231,228,0.05);
            border-color: rgba(52,231,228,0.12);
        }
        
        .reg-checkbox {
            width: 22px; height: 22px;
            accent-color: var(--green);
            cursor: pointer;
            flex-shrink: 0;
        }
        .reg-text {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .reg-action {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn {
            background: transparent;
            border: none;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .complete-btn { color: var(--green); }
        .complete-btn:hover { background: rgba(45,212,167,0.1); }
        .restore-btn { color: var(--cyan); }
        .restore-btn:hover { background: rgba(52,231,228,0.1); }
        .close-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 18px;
            cursor: pointer;
            width: 24px; height: 24px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .close-btn:hover { background: rgba(239,68,68,0.15); color: var(--red); }
        
        .single-column { display: flex; flex-direction: column; gap: 8px; }
        
        /* Toast */
        .toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 2000;
            display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            padding: 12px 24px;
            border-radius: 8px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Modals */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            width: 90%; max-width: 420px;
            padding: 24px;
            border-radius: var(--radius);
            background: var(--bg);
            border: 1px solid var(--glass-border);
        }
        .hidden { display: none !important; }
        
        .scanner-box {
            width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 12px; overflow: hidden; margin: 16px 0;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .button-row { grid-template-columns: repeat(2, 1fr); }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .two-column-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-theme="dark">
    <div class="orb orb1"></div><div class="orb orb2"></div>
    <div class="toast-container" id="toastContainer"></div>
    <div class="container">
        <header>
            <h1>🚐 HPC — Smart Job Scanner</h1>
            <div class="theme-toggle" id="themeToggle">🌙</div>
        </header>

        <!-- Auto-Expanding Paste Area -->
        <div class="paste-container">
            <label class="paste-label">📋 Paste registrations below (one per line, add " - DONE" to mark completed):</label>
            <div class="input-wrapper">
                <textarea id="inputArea" class="input-area" placeholder="BP24FCN
PJ22VHO
BT24JKN
BL24RM - DONE"></textarea>
                <button class="clear-paste" id="clearPaste" title="Clear">×</button>
            </div>
        </div>

        <!-- BUTTONS — 2 rows, 4 per line -->
        <div class="buttons-container">
            <div class="button-row">
                <button class="btn btn-default" id="rebuildBtn">REBUILD</button>
                <button class="btn btn-danger" id="removeBtn">✕ REMOVE</button>
                <button class="btn btn-scan" id="scanBtn">📷 SCAN</button>
                <button class="btn btn-danger" id="resetBtn">⌫ RESET</button>
            </div>
            <div class="button-row">
                <button class="btn btn-default" id="completedBtn">✓ COMPLETED</button>
                <button class="btn btn-default" id="exportBtn">⬇ EXPORT</button>
                <button class="btn btn-default" id="saveBtn">💾 SAVE</button>
                <button class="btn btn-default" id="restoreBtn">⬆ RESTORE</button>
            </div>
        </div>

        <!-- Stats — 4 in one horizontal line -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value cyan" id="foundCount">0</div>
                <div class="stat-label">FOUND</div>
            </div>
            <div class="stat-box">
                <div class="stat-value amber" id="pendingCount">0</div>
                <div class="stat-label">PENDING</div>
            </div>
            <div class="stat-box">
                <div class="stat-value green" id="doneCount">0</div>
                <div class="stat-label">DONE</div>
            </div>
            <div class="stat-box">
                <div class="stat-value blue" id="totalCount">0</div>
                <div class="stat-label">TOTAL</div>
            </div>
        </div>

        <!-- FOUND Section -->
        <div class="section">
            <h2 class="section-title">💠 FOUND <span style="font-size:0.9rem;opacity:0.5;">(scanned)</span></h2>
            <div id="foundList" class="single-column"></div>
        </div>

        <!-- PENDING Section — 2 Columns -->
        <div class="section">
            <h2 class="section-title">⏳ PENDING</h2>
            <div id="pendingContainer" class="two-column-layout">
                <div id="pendingCol1" class="column"></div>
                <div id="pendingCol2" class="column"></div>
            </div>
        </div>

        <!-- COMPLETED Section -->
        <div class="section">
            <h2 class="section-title">✅ COMPLETED</h2>
            <div id="completedList" class="single-column"></div>
        </div>
    </div>

    <!-- Scanner Modal -->
    <div class="modal hidden" id="scannerModal">
        <div class="modal-content">
            <h3 style="margin-bottom:12px;">📷 Scan Registration</h3>
            <div class="scanner-box">
                <video id="video" autoplay muted playsinline></video>
            </div>
            <div style="display:flex;gap:10px;margin-top:16px;">
                <button class="btn btn-default" id="torchBtn">🔦 Torch</button>
                <button class="btn btn-danger" id="closeScanner">✕ Close</button>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div class="modal hidden" id="exportModal">
        <div class="modal-content">
            <h3 style="margin-bottom:16px;">⬇ Export Jobs</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
                <button class="btn btn-default" id="exportAll">All Jobs</button>
                <button class="btn btn-default" id="exportCompleted">Completed Only</button>
                <button class="btn btn-default" id="exportRemaining">Remaining</button>
                <button class="btn btn-default" id="exportRegs">Reg Numbers Only</button>
            </div>
            <button class="btn btn-default" id="closeExport">Cancel</button>
        </div>
    </div>

    <script>
        let found = [];
        let pending = [];
        let completed = [];
        let notes = {};
        let checkedItems = {};

        const $ = id => document.getElementById(id);
        const inputArea = $('inputArea');
        const foundList = $('foundList');
        const pendingCol1 = $('pendingCol1');
        const pendingCol2 = $('pendingCol2');
        const completedList = $('completedList');
        const toastContainer = $('toastContainer');

        // Auto-expand textarea
        inputArea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        function toast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            toastContainer.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function updateStats() {
            $('foundCount').textContent = found.length;
            $('pendingCount').textContent = pending.length;
            $('doneCount').textContent = completed.length;
            $('totalCount').textContent = found.length + pending.length + completed.length;
        }

        function createCard(reg, type) {
            const isChecked = checkedItems[reg] || false;
            const div = document.createElement('div');
            div.className = `reg-card ${type === 'found' ? 'found' : ''} ${type === 'completed' ? 'completed' : ''}`;
            
            let content = '';
            if (type === 'pending') {
                content = `
                    <input type="checkbox" class="reg-checkbox" ${isChecked ? 'checked' : ''} 
                        onchange="toggleCheck('${reg}', this.checked)">
                    <span class="reg-text">${reg}</span>
                    <div class="reg-action">
                        ${isChecked 
                            ? `<button class="action-btn complete-btn" onclick="markComplete('${reg}')">✓ COMPLETE</button>`
                            : ''
                        }
                        <button class="close-btn" onclick="removeItem('${reg}', 'pending')">×</button>
                    </div>
                `;
            } else if (type === 'found') {
                content = `
                    <input type="checkbox" class="reg-checkbox" checked disabled>
                    <span class="reg-text">${reg}</span>
                    <div class="reg-action">
                        <button class="close-btn" onclick="removeItem('${reg}', 'found')">×</button>
                    </div>
                `;
            } else if (type === 'completed') {
                content = `
                    <input type="checkbox" class="reg-checkbox" checked disabled>
                    <span class="reg-text">${reg}</span>
                    <div class="reg-action">
                        <button class="action-btn restore-btn" onclick="restoreItem('${reg}')">↩ RESTORE</button>
                        <button class="close-btn" onclick="removeItem('${reg}', 'completed')">×</button>
                    </div>
                `;
            }
            div.innerHTML = content;
            return div;
        }

        function render() {
            foundList.innerHTML = '';
            pendingCol1.innerHTML = '';
            pendingCol2.innerHTML = '';
            completedList.innerHTML = '';
            
            found.forEach(r => foundList.appendChild(createCard(r, 'found')));
            
            const mid = Math.ceil(pending.length / 2);
            pending.slice(0, mid).forEach(r => pendingCol1.appendChild(createCard(r, 'pending')));
            pending.slice(mid).forEach(r => pendingCol2.appendChild(createCard(r, 'pending')));
            
            completed.forEach(r => completedList.appendChild(createCard(r, 'completed')));
            
            updateStats();
            localStorage.setItem('hpcData', JSON.stringify({ found, pending, completed, notes, checkedItems }));
        }

        window.toggleCheck = (reg, checked) => {
            checkedItems[reg] = checked;
            render();
        };

        function parseInput() {
            const text = inputArea.value;
            if (!text.trim()) return toast('⚠️ Nothing to parse — paste some registrations first');
            
            const lines = text.split(/\n/);
            let added = 0, done = 0, skipped = 0;
            
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                
                const isDone = /\s*-\s*DONE$/i.test(line);
                let cleanLine = line.replace(/\s*-\s*DONE$/i, '').trim();
                
                const regMatch = cleanLine.match(/\b([A-Z]{1,2}[0-9]{1,2}[A-Z]{1,3}|[A-Z0-9]{5,8})\b/i);
                if (!regMatch) return;
                
                const reg = regMatch[1].toUpperCase();
                
                if (found.includes(reg) || pending.includes(reg) || completed.includes(reg)) {
                    skipped++;
                    return;
                }
                
                if (isDone) {
                    completed.push(reg);
                    done++;
                } else {
                    pending.push(reg);
                    added++;
                }
            });
            
            let msg = '';
            if (added) msg += `✅ Added ${added} to Pending`;
            if (done) msg += `${msg ? ' | ' : ''}✅ ${done} moved to Completed`;
            if (skipped) msg += `${msg ? ' | ' : ''}⚠️ ${skipped} duplicate(s) skipped`;
            if (!msg) msg = '⚠️ No valid registrations found';
            
            toast(msg);
            render();
        }

        window.removeItem = (reg, list) => {
            if (!confirm(`Remove ${reg}? This cannot be undone.`)) return;
            if (list === 'found') found = found.filter(r => r !== reg);
            if (list === 'pending') {
                pending = pending.filter(r => r !== reg);
                delete checkedItems[reg];
            }
            if (list === 'completed') completed = completed.filter(r => r !== reg);
            delete notes[reg];
            toast(`🗑️ Removed ${reg}`);
            render();
        };

        window.markComplete = (reg) => {
            pending = pending.filter(r => r !== reg);
            delete checkedItems[reg];
            if (!completed.includes(reg)) completed.push(reg);
            toast(`✅ ${reg} marked as completed`);
            render();
        };

        window.restoreItem = (reg) => {
            completed = completed.filter(r => r !== reg);
            if (!pending.includes(reg)) pending.unshift(reg);
            toast(`↩️ ${reg} restored to Pending`);
            render();
        };

        // Button Events
        $('rebuildBtn').onclick = parseInput;
        
        $('clearPaste').onclick = () => {
            inputArea.value = '';
            inputArea.style.height = 'auto';
            toast('📋 Paste area cleared');
        };

        $('removeBtn').onclick = () => {
            const selected = pending.filter(r => checkedItems[r]);
            if (!selected.length) return toast('⚠️ Check items first to remove them');
            if (confirm(`Remove ${selected.length} selected item(s)?`)) {
                selected.forEach(r => {
                    pending = pending.filter(p => p !== r);
                    delete checkedItems[r];
                });
                toast(`🗑️ Removed ${selected.length} item(s)`);
                render();
            }
        };

        $('resetBtn').onclick = () => {
            if (confirm('⚠️ Reset ALL data? This cannot be undone!')) {
                found = []; pending = []; completed = []; notes = {}; checkedItems = {};
                inputArea.value = '';
                inputArea.style.height = 'auto';
                render();
                toast('♻️ All data has been reset');
            }
        };

        $('completedBtn').onclick = () => {
            const selected = pending.filter(r => checkedItems[r]);
            if (!selected.length) return toast('⚠️ Check items first to mark complete');
            if (confirm(`Mark ${selected.length} item(s) as Completed?`)) {
                selected.forEach(r => {
                    pending = pending.filter(p => p !== r);
                    delete checkedItems[r];
                    if (!completed.includes(r)) completed.push(r);
                });
                toast(`✅ ${selected.length} item(s) moved to Completed`);
                render();
            }
        };

        $('exportBtn').onclick = () => $('exportModal').classList.remove('hidden');
        $('closeExport').onclick = () => $('exportModal').classList.add('hidden');
        
        $('exportAll').onclick = () => exportFile('ALL', [...found, ...pending, ...completed]);
        $('exportCompleted').onclick = () => exportFile('COMPLETED', completed);
        $('exportRemaining').onclick = () => exportFile('REMAINING', [...found, ...pending]);
        $('exportRegs').onclick = () => exportFile('REG-NUMBERS', [...found, ...pending, ...completed]);
        
        function exportFile(type, data) {
            const d = new Date();
            const date = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
            const content = data.join('\n');
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `HPC-RegScanner-${type}-${date}.txt`;
            a.click();
            URL.revokeObjectURL(a.href);
            $('exportModal').classList.add('hidden');
            toast(`⬇ Exported: ${data.length} registrations`);
        }

        $('saveBtn').onclick = () => {
            const d = new Date();
            const date = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
            const data = { found, pending, completed, notes, checkedItems };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `HPC-RegScanner-SAVE-${date}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
            toast('💾 Data saved to file');
        };

        $('restoreBtn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const obj = JSON.parse(ev.target.result);
                        found = obj.found || [];
                        pending = obj.pending || [];
                        completed = obj.completed || [];
                        notes = obj.notes || {};
                        checkedItems = obj.checkedItems || {};
                        render();
                        toast('⬆ Data restored successfully');
                    } catch {
                        toast('⚠️ Invalid file — could not restore');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        };

        // Camera Scanner
        let stream = null;
        $('scanBtn').onclick = () => {
            $('scannerModal').classList.remove('hidden');
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: 1280, height: 720 } 
            })
                .then(s => {
                    stream = s;
                    $('video').srcObject = s;
                    startOCR();
                })
                .catch(err => {
                    toast('⚠️ Camera unavailable — check permissions');
                    $('scannerModal').classList.add('hidden');
                });
        };

        function startOCR() {
            const video = $('video');
            let scanning = true;
            
            const recognize = async () => {
                if (!scanning || !video.srcObject) return;
                try {
                    const { data: { text } } = await Tesseract.recognize(video, 'eng', {
                        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ',
                        psm: 7
                    });
                    
                    const regs = text.toUpperCase().match(/[A-Z]{1,3}[0-9]{1,4}[A-Z]{0,3}/g);
                    if (regs) {
                        const reg = regs[0].replace(/\s+/g, '');
                        if (found.includes(reg) || completed.includes(reg)) {
                            toast(`⚠️ ${reg} already exists`);
                            return;
                        }
                        if (pending.includes(reg)) pending = pending.filter(r => r !== reg);
                        found.push(reg);
                        toast(`✅ ${reg} — ADDED to FOUND`);
                        render();
                        scanning = false;
                        setTimeout(() => {
                            $('scannerModal').classList.add('hidden');
                            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
                        }, 800);
                        return;
                    }
                } catch(e) { console.log('OCR skip:', e); }
                setTimeout(recognize, 2500);
            };
            recognize();
        }

        $('closeScanner').onclick = () => {
            $('scannerModal').classList.add('hidden');
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        };

        $('torchBtn').onclick = async () => {
            if (!stream) return toast('⚠️ Camera not active');
            const track = stream.getVideoTracks()[0];
            if (!track) return;
            try {
                const cap = track.getCapabilities();
                if (!cap.torch) return toast('⚠️ Torch not supported on this device');
                const active = track.getConstraints().advanced?.some(c => c.torch) || false;
                await track.applyConstraints({ advanced: [{ torch: !active }] });
                toast(`🔦 Torch: ${!active ? 'ON' : 'OFF'}`);
            } catch {
                toast('⚠️ Torch not available');
            }
        };

        // Theme Toggle
        $('themeToggle').onclick = () => {
            const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            $('themeToggle').textContent = next === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('regscanner_theme', next);
        };

        // Load on startup
        window.addEventListener('load', () => {
            const savedTheme = localStorage.getItem('regscanner_theme') || 'dark';
            document.documentElement.dataset.theme = savedTheme;
            $('themeToggle').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
            
            const saved = localStorage.getItem('hpcData');
            if (saved) {
                try {
                    const obj = JSON.parse(saved);
                    found = obj.found || [];
                    pending = obj.pending || [];
                    completed = obj.completed || [];
                    notes = obj.notes || {};
                    checkedItems = obj.checkedItems || {};
                } catch(e) { console.log('No saved data'); }
            }
            render();
        });
    </script>
</body>
</html>
